[package]
name = "maxwells-demon-detector"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
description = "Realtime ASCII landscape of structure (entropy, dependency, rhythm) flowing through data streams: packets, event logs, raw bytes"
authors = ["whispr.dev"]
# GPL-3.0-only, as in the repository's LICENSE and the SPDX line atop every code file.
license = "GPL-3.0-only"
repository = "https://github.com/whisprer-specops/maxwells-demon-detector"
readme = "README.md"
default-run = "mdd"

[[bin]]
name = "mdd"
path = "src/main.rs"

[features]
default = []
# Live capture is always built in since 0.4.0 (Npcap or libpcap is loaded when live mode
# starts). This empty feature only keeps older `--features live` build commands working.
live = []

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
